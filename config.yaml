name: Claude Code Legacy CPU
version: "1.0.15"
slug: hass-claude-code-legacy
description: Claude Code AI assistant for Home Assistant using Node for legacy CPU compatibility
url: https://github.com/atsavlis-glitch/hass-claude-code-legacy

arch:
  - amd64

startup: application
boot: auto
init: false
apparmor: false

ingress: true
ingress_port: 7681
ingress_stream: true

watchdog: tcp://[HOST]:[PORT:7681]

panel_icon: mdi:head-snowflake

homeassistant_api: true
auth_api: true
hassio_api: true
hassio_role: manager

map:
  - homeassistant_config:rw
  - ssl:ro
  - share:rw
  - media:rw
  - addon_config:rw

options:
  terminal_font_size: 14
  terminal_theme: dark
  auto_update_claude: false
  use_bedrock: true
  aws_region: "us-east-1"
  aws_bedrock_token: ""
  bedrock_model: "us.anthropic.claude-sonnet-4-6"

schema:
  terminal_font_size: "int(10,24)"
  terminal_theme: "list(dark|light)"
  auto_update_claude: bool
  use_bedrock: bool
  aws_region: str
  aws_bedrock_token: password
  bedrock_model: "list(us.anthropic.claude-sonnet-4-6|us.anthropic.claude-opus-4-6)"
